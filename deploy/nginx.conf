# Example internal HTTPS virtual host; adjust host, certificate, and FPM socket.
server {
    listen 443 ssl;
    server_name kb.internal.example;
    ssl_certificate /etc/ssl/certs/kb-internal.crt;
    ssl_certificate_key /etc/ssl/private/kb-internal.key;
    root /opt/SimplePHPKB/public;
    index index.php;
    client_max_body_size 14m;
    autoindex off;
    location / { try_files $uri $uri/ =404; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/SimplePHPKB/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

