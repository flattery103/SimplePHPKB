# Example internal HTTPS virtual host. Replace hostname and certificate paths.
# Requires mod_ssl and a working PHP handler (mod_php or your PHP-FPM setup).
<VirtualHost *:443>
    ServerName kb.internal.example
    DocumentRoot /opt/SimplePHPKB/public
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/kb-internal.crt
    SSLCertificateKeyFile /etc/ssl/private/kb-internal.key
    <Directory /opt/SimplePHPKB/public>
        Options -Indexes -Includes
        AllowOverride None
        DirectoryIndex index.php
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/simplephpkb-error.log
    CustomLog ${APACHE_LOG_DIR}/simplephpkb-access.log combined
</VirtualHost>

# Subdirectory alternative: inside an EXISTING internal HTTPS virtual host,
# use the following instead of the dedicated DocumentRoot/vhost above.
# Set config base_path to /kb. Keep the Directory block scoped to public only.
# Alias /kb /opt/SimplePHPKB/public
